    <style>
      body {
        font-family: 'Poppins', sans-serif;
      }
      /* Custom CSS for blob animation */
      @keyframes blob-bounce {
        0%, 100% {
          transform: scale(1) translate(0, 0);
        }
        25% {
          transform: scale(1.05) translate(-10%, 10%);
        }
        50% {
          transform: scale(0.95) translate(15%, -5%);
        }
        75% {
          transform: scale(1.03) translate(-5%, -15%);
        }
      }

      .blob-animation-1 {
        animation: blob-bounce 15s ease-in-out infinite alternate;
      }
      .blob-animation-2 {
        animation: blob-bounce 18s ease-in-out infinite alternate-reverse;
      }
    </style>
